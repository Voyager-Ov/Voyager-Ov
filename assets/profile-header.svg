      <stop stop-color="#070712"/>
      <stop offset="0.48" stop-color="#111827"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="a" x1="166" y1="63" x2="1072" y2="320" gradientUnits="userSpaceOnUse">
