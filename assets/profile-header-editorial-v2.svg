<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Octavio Velo portfolio header</title>
  <desc id="desc">Editorial graphic portfolio style banner inspired by bold grids, halftone textures and archival design.</desc>

  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" stroke="#1F2937" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <pattern id="halftone" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#111111" opacity="0.9"/>
    </pattern>
    <pattern id="blueDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#0F4CFF" opacity="0.65"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="#F4F1EA"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <rect x="24" y="24" width="1152" height="312" rx="24" fill="#F8F5EE" stroke="#111111" stroke-opacity="0.08"/>

  <g opacity="0.96">
    <text x="58" y="107" fill="#D90429" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="74" font-weight="900" letter-spacing="-5">WELCOME</text>
    <text x="58" y="174" fill="#D90429" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="74" font-weight="900" letter-spacing="-5">TO MY</text>
    <text x="58" y="241" fill="#D90429" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="74" font-weight="900" letter-spacing="-5">PORTFOLIO</text>
    <rect x="47" y="42" width="8" height="226" fill="#D90429"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="430" y="57" width="314" height="178" rx="22" fill="#0F4CFF"/>
    <rect x="430" y="57" width="314" height="178" rx="22" fill="url(#blueDots)" opacity="0.42"/>
    <text x="463" y="122" fill="#F8F5EE" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="40" font-weight="900" letter-spacing="-1.5">NEW ARCHIVE</text>
    <text x="463" y="160" fill="#F8F5EE" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="31" font-weight="900" letter-spacing="-1.2">FULL STACK</text>
    <text x="463" y="194" fill="#D9E8FF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Córdoba, Argentina ©2026</text>
  </g>

  <g transform="translate(785 47)">
    <rect width="190" height="214" rx="20" fill="#EFE7D8" stroke="#111111" stroke-opacity="0.12"/>
    <path d="M26 70C55 32 86 105 114 67C143 28 164 78 174 54" stroke="#0F4CFF" stroke-width="20" stroke-linecap="round" opacity="0.62"/>
    <path d="M24 128C53 91 84 163 113 126C141 87 163 136 173 112" stroke="#0F4CFF" stroke-width="20" stroke-linecap="round" opacity="0.62"/>
    <text x="22" y="37" fill="#111111" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="29" font-weight="900" letter-spacing="-1.3">SIGHT+CODE</text>
    <ellipse cx="66" cy="77" rx="17" ry="10" fill="#F8F5EE" stroke="#111111" stroke-width="2"/>
    <circle cx="66" cy="77" r="4" fill="#111111"/>
    <ellipse cx="129" cy="77" rx="17" ry="10" fill="#F8F5EE" stroke="#111111" stroke-width="2"/>
    <circle cx="129" cy="77" r="4" fill="#111111"/>
    <ellipse cx="66" cy="135" rx="17" ry="10" fill="#F8F5EE" stroke="#111111" stroke-width="2"/>
    <circle cx="66" cy="135" r="4" fill="#111111"/>
    <ellipse cx="129" cy="135" rx="17" ry="10" fill="#F8F5EE" stroke="#111111" stroke-width="2"/>
    <circle cx="129" cy="135" r="4" fill="#111111"/>
    <text x="25" y="185" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800">SYSTEMS • IA • WEB APPS</text>
  </g>

  <g transform="translate(1000 26)">
    <rect width="154" height="308" rx="18" fill="#111111"/>
    <rect width="154" height="308" rx="18" fill="url(#halftone)" opacity="0.78"/>
    <text x="77" y="129" text-anchor="middle" fill="#F8F5EE" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="28" font-weight="900" letter-spacing="-1">VOYAGER</text>
    <text x="77" y="163" text-anchor="middle" fill="#F8F5EE" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="26" font-weight="900" letter-spacing="-1">OV</text>
    <rect x="32" y="184" width="90" height="7" rx="4" fill="#D90429"/>
    <rect x="42" y="202" width="70" height="7" rx="4" fill="#0F4CFF"/>
  </g>

  <g transform="translate(430 258)">
    <rect width="96" height="35" rx="17.5" fill="#111111"/>
    <text x="48" y="23" text-anchor="middle" fill="#F8F5EE" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900">NEXT.JS</text>
    <rect x="108" width="126" height="35" rx="17.5" fill="#D90429"/>
    <text x="171" y="23" text-anchor="middle" fill="#F8F5EE" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900">TYPESCRIPT</text>
    <rect x="246" width="130" height="35" rx="17.5" fill="#0F4CFF"/>
    <text x="311" y="23" text-anchor="middle" fill="#F8F5EE" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900">POSTGRESQL</text>
    <rect x="388" width="69" height="35" rx="17.5" fill="#14532D"/>
    <text x="422" y="23" text-anchor="middle" fill="#F8F5EE" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900">AI</text>
  </g>

  <text x="59" y="300" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="0.2">Octavio Velo — Full-Stack Developer / UTN FRC</text>
  <text x="59" y="322" fill="#111111" opacity="0.72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">business systems · dashboards · automation · artificial intelligence</text>
</svg>
