<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Octavio Velo - Portfolio Header</title>
  <desc id="desc">Clean editorial portfolio header with red typography, glass shape and rounded skill buttons.</desc>

  <defs>
    <linearGradient id="glass" x1="360" y1="55" x2="890" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.52" stop-color="#DDEBFF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="blueBlur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2F80ED" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7DB7FF" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="blurBlob" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1F2937" flood-opacity="0.12"/>
    </filter>
    <pattern id="paperGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#111111" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="tinyDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#111111" opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="32" fill="#F7F4ED"/>
  <rect width="1200" height="360" rx="32" fill="url(#paperGrid)"/>

  <circle cx="805" cy="114" r="118" fill="url(#blueBlur)" filter="url(#blurBlob)" opacity="0.65"/>
  <circle cx="578" cy="258" r="78" fill="#FFB4A2" filter="url(#blurBlob)" opacity="0.34"/>

  <g filter="url(#softShadow)">
    <rect x="390" y="66" width="500" height="205" rx="34" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.75"/>
    <rect x="390" y="66" width="500" height="205" rx="34" fill="url(#tinyDots)" opacity="0.45"/>
    <rect x="426" y="103" width="176" height="52" rx="18" fill="#FFFFFF" fill-opacity="0.46" stroke="#FFFFFF" stroke-opacity="0.75"/>
    <rect x="626" y="103" width="206" height="52" rx="18" fill="#FFFFFF" fill-opacity="0.30" stroke="#FFFFFF" stroke-opacity="0.62"/>
    <rect x="426" y="177" width="406" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.42"/>
    <rect x="426" y="211" width="300" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.34"/>
  </g>

  <text x="64" y="104" fill="#C90016" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="-4.8">WELCOME</text>
  <text x="64" y="171" fill="#C90016" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="-4.8">TO MY</text>
  <text x="64" y="238" fill="#C90016" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="-4.8">PORTFOLIO</text>

  <rect x="58" y="55" width="7" height="196" rx="3.5" fill="#C90016"/>

  <text x="928" y="103" fill="#111111" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="38" font-weight="900" letter-spacing="-1.9">Octavio</text>
  <text x="928" y="145" fill="#111111" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="38" font-weight="900" letter-spacing="-1.9">Velo</text>
  <text x="930" y="177" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">Full-Stack Developer</text>
  <text x="930" y="202" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">UTN FRC · Argentina</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900">
    <rect x="64" y="282" width="93" height="34" rx="17" fill="#111111"/>
    <text x="110.5" y="304" text-anchor="middle" fill="#FFFFFF">Next.js</text>
    <rect x="169" y="282" width="116" height="34" rx="17" fill="#C90016"/>
    <text x="227" y="304" text-anchor="middle" fill="#FFFFFF">TypeScript</text>
    <rect x="297" y="282" width="121" height="34" rx="17" fill="#FFFFFF" stroke="#111111" stroke-opacity="0.34"/>
    <text x="357.5" y="304" text-anchor="middle" fill="#111111">PostgreSQL</text>
    <rect x="430" y="282" width="80" height="34" rx="17" fill="#EDE7DA" stroke="#111111" stroke-opacity="0.22"/>
    <text x="470" y="304" text-anchor="middle" fill="#111111">Prisma</text>
    <rect x="522" y="282" width="92" height="34" rx="17" fill="#EDE7DA" stroke="#111111" stroke-opacity="0.22"/>
    <text x="568" y="304" text-anchor="middle" fill="#111111">Firebase</text>
    <rect x="626" y="282" width="55" height="34" rx="17" fill="#2F80ED"/>
    <text x="653.5" y="304" text-anchor="middle" fill="#FFFFFF">AI</text>
  </g>

  <text x="930" y="256" fill="#111111" opacity="0.65" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">business systems · dashboards · automation</text>
  <text x="930" y="278" fill="#111111" opacity="0.65" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">real software for real operations</text>
</svg>
